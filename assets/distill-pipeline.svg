<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" role="img" aria-labelledby="title desc">
  <title id="title">How distill works</title>
  <desc id="desc">From a noisy webpage to clean Markdown: fetch, optional browser, clean, extract, convert.</desc>

  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171412"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1000" height="348" rx="20" fill="url(#board)"/>
  <rect width="1000" height="348" rx="20" fill="url(#glow)"/>

  <text x="48" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5eead4" letter-spacing="0.22em">DISTILL</text>
  <text x="48" y="80" font-family="Georgia, 'Times New Roman', Times, serif" font-size="28" fill="#f5f0e8">From noisy page to clean Markdown.</text>
  <text x="48" y="106" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#a8a29e">Static-first pipeline. Browser only when the HTML is empty.</text>

  <!-- main flow arrows (short, gap-centered) -->
  <line x1="146" y1="230" x2="164" y2="230" stroke="#2dd4bf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrTeal)"/>
  <line x1="326" y1="230" x2="348" y2="230" stroke="#2dd4bf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrTeal)"/>
  <line x1="510" y1="230" x2="528" y2="230" stroke="#2dd4bf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrTeal)"/>
  <line x1="638" y1="230" x2="656" y2="230" stroke="#2dd4bf" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrTeal)"/>
  <line x1="766" y1="230" x2="784" y2="230" stroke="#5eead4" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrTeal)"/>

  <!-- browser branch: arcs from fetch ? browser ? clean -->
  <path d="M220 206 C220 172 260 156 281 156" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>
  <path d="M395 156 C416 156 456 172 456 206" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>
  <text x="338" y="144" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fbbf24">only if needed</text>

  <rect x="48" y="206" width="94" height="48" rx="24" fill="#292524" stroke="#78716c" stroke-width="1.25"/>
  <text x="95" y="236" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e7e5e4" letter-spacing="0.08em">NOISE</text>

  <rect x="170" y="206" width="100" height="48" rx="24" fill="#1c1917" stroke="#44403c" stroke-width="1.25"/>
  <text x="220" y="236" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fafaf9">fetch</text>

  <!-- browser centered over fetch?clean gap (gap center = 338) -->
  <rect x="281" y="136" width="114" height="40" rx="20" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="338" y="161" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fde68a">browser</text>

  <rect x="406" y="206" width="100" height="48" rx="24" fill="#1c1917" stroke="#44403c" stroke-width="1.25"/>
  <text x="456" y="236" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fafaf9">clean</text>

  <rect x="534" y="206" width="100" height="48" rx="24" fill="#1c1917" stroke="#44403c" stroke-width="1.25"/>
  <text x="584" y="236" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fafaf9">extract</text>

  <rect x="662" y="206" width="100" height="48" rx="24" fill="#1c1917" stroke="#44403c" stroke-width="1.25"/>
  <text x="712" y="236" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fafaf9">convert</text>

  <g filter="url(#softGlow)">
    <rect x="790" y="202" width="162" height="56" rx="28" fill="url(#signal)"/>
  </g>
  <text x="871" y="226" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#042f2e" letter-spacing="0.14em">SIGNAL</text>
  <text x="871" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" fill="#042f2e">Markdown</text>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    <rect x="48" y="290" width="72" height="28" rx="14" fill="#292524"/>
    <text x="84" y="308" text-anchor="middle" fill="#a8a29e">local</text>
    <rect x="132" y="290" width="120" height="28" rx="14" fill="#292524"/>
    <text x="192" y="308" text-anchor="middle" fill="#a8a29e">deterministic</text>
    <rect x="264" y="290" width="148" height="28" rx="14" fill="#292524"/>
    <text x="338" y="308" text-anchor="middle" fill="#a8a29e">no LLM rewrite</text>
    <rect x="424" y="290" width="148" height="28" rx="14" fill="#134e4a"/>
    <text x="498" y="308" text-anchor="middle" fill="#5eead4">~16 ms process</text>
  </g>
</svg>
