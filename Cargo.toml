[package]
name = "distill"
version = "0.1.0"
edition = "2021"
description = "Convert any website into clean, agent-ready Markdown. Local-first, fast, deterministic."
license = "MIT"

# NOTE: the crate name `distill` is taken on crates.io (an asset pipeline).
# This is fine for local builds; pick a publish name later (e.g. `distill-md`).
[[bin]]
name = "distill"
path = "src/main.rs"

# MCP server binary. Built only with `--features mcp` so the default CLI build
# stays lean (no tokio/rmcp).
[[bin]]
name = "distill-mcp"
path = "src/bin/distill_mcp.rs"
required-features = ["mcp"]

[features]
default = []
# Expose distill as a Model Context Protocol server over stdio.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars", "dep:serde"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "deflate", "rustls-tls"] }
kuchikiki = "0.8"
url = "2"
anyhow = "1"
regex = "1"
once_cell = "1"
encoding_rs = "0.8"

# MCP server (optional; enabled by the `mcp` feature).
rmcp = { version = "3", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
