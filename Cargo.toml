# `distill` is taken on crates.io/npm, so we publish as `distill-md`. The
# library crate and the CLI command stay `distill` (see [lib] and [[bin]]),
# so `use distill::…` and the `distill` command are unchanged.
[package]
name = "distill-md"
version = "0.1.1"
edition = "2021"
description = "Convert any website into clean, agent-ready Markdown. Local-first, fast, deterministic."
license = "GPL-3.0-or-later"
repository = "https://github.com/gokulnair2001/distill"
homepage = "https://github.com/gokulnair2001/distill"
readme = "README.md"
keywords = ["markdown", "html", "scraping", "mcp", "agent"]
categories = ["command-line-utilities", "text-processing"]

# Keep the library crate named `distill` regardless of the package name.
# `cdylib` is needed for the WebAssembly build (see the `wasm` feature); `rlib`
# keeps the crate usable by the binaries and tests as before.
[lib]
name = "distill"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "distill"
path = "src/main.rs"

# MCP server binary. Built only with `--features mcp` so the default CLI build
# stays lean (no tokio/rmcp).
[[bin]]
name = "distill-mcp"
path = "src/bin/distill_mcp.rs"
required-features = ["mcp"]

[features]
# The CLI needs the network stack (fetch + JS rendering); it's on by default.
default = ["net"]
# Network + OS-bound pipeline (HTTP fetch, SSRF guard, headless-browser render).
# Turned off for the WebAssembly build, which only runs the pure HTML->Markdown core.
net = ["dep:reqwest"]
# Expose distill as a Model Context Protocol server over stdio.
mcp = ["net", "dep:rmcp", "dep:tokio", "dep:schemars", "dep:serde"]
# Compile the pure `distill_html` core to WebAssembly (see `src/wasm.rs`).
wasm = ["dep:wasm-bindgen"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "deflate", "rustls-tls"], optional = true }
kuchikiki = "0.8"
url = "2"
anyhow = "1"
regex = "1"
once_cell = "1"
encoding_rs = "0.8"

# WebAssembly bindings (optional; enabled by the `wasm` feature).
wasm-bindgen = { version = "0.2", optional = true }

# MCP server (optional; enabled by the `mcp` feature).
rmcp = { version = "3", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# wasm-pack post-processes the module with wasm-opt; the generated code uses
# bulk-memory ops, so enable that feature (default validation rejects them).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext', '--enable-mutable-globals', '--enable-reference-types', '--enable-multivalue']

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
